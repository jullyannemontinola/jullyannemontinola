name: Generate Profile
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes (GitHub Actions minimum interval)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate individual aura components
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.METRICTOKEN }}

      - name: Generate unified profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICTOKEN }}
          GITHUB_USER: jullyannemontinola
        run: node .github/scripts/generate-profile.js

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jullyannemontinola
          outputs: |
            .github/assets/contribution-snake.svg
            .github/assets/contribution-snake-dark.svg?palette=github-dark

      - name: Set README to single profile SVG
        run: |
          cat > README.md <<'EOF'
          <p align="center">
            <img src="https://komarev.com/ghpvc/?username=jullyannemontinola&label=Profile%20views&color=0e75b6&style=flat" alt="jullyannemontinola" />
          </p>

          ![JULES Profile](./.github/assets/profile.svg)

          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="./.github/assets/contribution-snake-dark.svg" />
            <source media="(prefers-color-scheme: light)" srcset="./.github/assets/contribution-snake.svg" />
            <img alt="Contribution Snake" src="./.github/assets/contribution-snake.svg" />
          </picture>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force .github/assets/*.svg README.md
          git diff --staged --quiet || (git commit -m "chore: update profile" && git push)
